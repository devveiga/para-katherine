<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para Katherine — um buquê que não murcha</title>
<style>
  :root {
    --bg: #000000;
    --bg-vignette: #170811;
    --bg-vignette-2: #000000;
    --paper: #f3e6d6;
    --paper-2: #ece0cf;
    --ink: #3a1015;
    --ink-soft: #6b2a30;
    --gold: #c9a24b;
    --gold-soft: #8a6f34;
    --crimson: #8c1f2b;
    --crimson-light: #b8394a;
    --crimson-deep: #5c1119;
    --rose: #a83b4a;
    --rose-light: #c65f6c;
    --wine: #6e1a2a;
    --wine-light: #93293c;
    --noir: #09090b;
    --noir-sheen: #33333b;
    --stem: #4c7350;
    --stem-dark: #33502f;
    --shadow: rgba(0, 0, 0, 0.7);
    --text: #f3e6d6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
  }

  body {
    font-family: Optima, Candara, "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow-x: hidden;
    background:
      radial-gradient(ellipse 90% 60% at 50% 8%, var(--bg-vignette) 0%, transparent 60%),
      radial-gradient(ellipse 120% 80% at 50% 100%, var(--bg-vignette-2) 0%, transparent 55%),
      var(--bg);
    min-height: 100vh;
  }

  .stage-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1.2rem, 4vw, 2.2rem);
    padding: clamp(2rem, 6vw, 4rem) 1.2rem clamp(3rem, 8vw, 5rem);
    max-width: 1100px;
    margin: 0 auto;
  }

  #fireflies {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.8;
  }

  .dedication {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 34rem;
  }

  .eyebrow {
    margin: 0 0 0.6em;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
  }

  h1 {
    margin: 0;
    font-family: "Big Caslon", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.9rem, 5.2vw, 3.1rem);
    line-height: 1.15;
    letter-spacing: 0.01em;
    text-wrap: balance;
    color: var(--text);
  }

  .heart {
    color: var(--crimson-light);
    font-size: 0.85em;
    display: inline-block;
    transform: translateY(-0.05em);
  }

  .flourish {
    width: 8em;
    height: 1px;
    margin: 0.9em auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    position: relative;
  }

  .flourish::before {
    content: "❧";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -55%);
    background: var(--bg);
    color: var(--gold);
    padding: 0 0.5em;
    font-size: 0.9rem;
  }

  .hint {
    margin: 0;
    font-size: 0.82rem;
    letter-spacing: 0.02em;
    color: var(--gold-soft);
    opacity: 0.9;
  }

  .bouquet {
    position: relative;
    z-index: 1;
    width: min(94vw, 780px);
    aspect-ratio: 840 / 640;
    font-size: clamp(9px, 1.9vw, 16px);
  }

  .stems {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .stems path.stem {
    fill: none;
    stroke: var(--stem);
    stroke-width: 5;
    stroke-linecap: round;
    transform-box: view-box;
    transform-origin: 420px 538px;
    transform: scale(0);
    opacity: 0;
    animation: stemShoot 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: var(--sdelay, 0.3s);
  }

  .stems path.stem-glow {
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-dasharray: 7 200;
    stroke-dashoffset: 7;
    opacity: 0;
    filter: drop-shadow(0 0 0.3em var(--gold));
    animation: cometTravel 0.85s ease-in-out forwards;
    animation-delay: var(--sdelay, 0.3s);
  }

  .stems .leaf {
    fill: var(--stem-dark);
    opacity: 0;
    animation: leafIn 0.6s ease-out forwards;
    animation-delay: var(--ldelay, 0.9s);
  }

  .ribbon {
    position: absolute;
    left: 50%;
    top: 80.6%;
    width: 9em;
    height: 6em;
    transform: translate(-50%, 0) scale(0.7);
    opacity: 0;
    animation: ribbonIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    animation-delay: 0.05s;
  }

  .ribbon .loop {
    position: absolute;
    top: 0;
    width: 3.6em;
    height: 2.6em;
    background: linear-gradient(135deg, var(--gold), var(--gold-soft));
    border: 1px solid var(--gold-soft);
  }

  .ribbon .loop.left {
    left: 0.6em;
    border-radius: 100% 10% 60% 40% / 100% 30% 100% 30%;
    transform: rotate(-18deg);
  }

  .ribbon .loop.right {
    right: 0.6em;
    border-radius: 10% 100% 40% 60% / 30% 100% 30% 100%;
    transform: rotate(18deg);
  }

  .ribbon .knot {
    position: absolute;
    left: 50%;
    top: 0.35em;
    width: 1.5em;
    height: 1.9em;
    transform: translateX(-50%);
    background: linear-gradient(160deg, var(--gold), var(--gold-soft));
    border: 1px solid var(--gold-soft);
    border-radius: 30%;
  }

  .ribbon .tail {
    position: absolute;
    top: 1.7em;
    width: 0.9em;
    height: 3.2em;
    background: linear-gradient(var(--gold), var(--gold-soft));
    clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%);
  }

  .ribbon .tail.left { left: 2.9em; transform: rotate(-8deg); }
  .ribbon .tail.right { right: 2.9em; transform: rotate(8deg); }

  .flower {
    all: unset;
    position: absolute;
    left: var(--x);
    top: var(--y);
    /* --size: diâmetro da corola em escala 1. --s e --rot agem só na corola, não no bilhete. */
    width: calc(var(--size, 6em) * var(--s, 1));
    height: calc(var(--size, 6em) * var(--s, 1));
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: var(--z, 2);
    opacity: 0;
    animation: bloomIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: var(--delay, 1s);
    -webkit-tap-highlight-color: transparent;
  }

  /* a flor ativa vem para a frente, para o bilhete não ficar atrás das vizinhas */
  .flower.is-open {
    z-index: 10;
  }

  .flower:hover,
  .flower:focus-visible {
    z-index: 11;
  }

  .flower:focus-visible {
    box-shadow: 0 0 0 0.2em color-mix(in srgb, var(--gold) 60%, transparent);
  }

  .flower:focus-visible .center {
    box-shadow: 0 0 0 0.28em color-mix(in srgb, var(--gold) 55%, transparent),
      0 0 0.6em 0.15em var(--gold);
  }

  .petals {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    transform: scale(var(--s, 1)) rotate(var(--rot, 0deg));
    /* contorno claro: sem ele a flor preta some no fundo preto */
    filter: drop-shadow(0 0 0.06em rgba(255, 255, 255, 0.5));
    transition: filter 0.45s ease;
  }

  .flower:hover .petals,
  .flower:focus-visible .petals,
  .flower.is-open .petals {
    filter: drop-shadow(0 0 0.14em rgba(240, 217, 152, 0.85));
  }

  .petal {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), filter 0.45s ease;
    filter: saturate(0.95) brightness(0.97);
  }

  .flower:hover .petal,
  .flower:focus-visible .petal,
  .flower.is-open .petal {
    filter: saturate(1.2) brightness(1.6);
  }

  /* --- padrão (sem espécie definida): pétala arredondada, corola de 6 --- */
  .flower:not([class*="flower--"]) .petal {
    width: 1.9em;
    height: 3em;
    margin: -3em 0 0 -0.95em;
    border-radius: 50% 50% 50% 50% / 68% 68% 32% 32%;
    background: linear-gradient(180deg, var(--petal-hi, var(--noir-sheen)) 0%, var(--petal-lo, var(--noir)) 78%);
    transform: rotate(calc(var(--i) * 60deg)) translateY(-0.1em) scale(0.94);
  }
  .flower:not([class*="flower--"]):hover .petal,
  .flower:not([class*="flower--"]):focus-visible .petal,
  .flower:not([class*="flower--"]).is-open .petal {
    transform: rotate(calc(var(--i) * 60deg)) translateY(-0.4em) scale(1.06);
  }

  /* --- lírio: 6 pétalas pontudas em estrela, pretas com um vinco no meio --- */
  .flower--lily { --size: 6em; }
  .flower--lily .petal {
    width: 2.1em;
    height: 3.2em;
    margin: -3.2em 0 0 -1.05em;
    clip-path: polygon(50% 0%, 66% 16%, 80% 38%, 84% 54%, 76% 78%, 64% 100%, 36% 100%, 24% 78%, 16% 54%, 20% 38%, 34% 16%);
    background:
      linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0 50%, rgba(0, 0, 0, 0.3) 50% 100%),
      linear-gradient(180deg, #3e3e47 0%, #141418 52%, #050506 100%);
    transform: rotate(calc(var(--i) * 60deg)) translateY(-0.08em) scale(0.92);
  }
  .flower--lily:hover .petal,
  .flower--lily:focus-visible .petal,
  .flower--lily.is-open .petal {
    transform: rotate(calc(var(--i) * 60deg)) translateY(-0.3em) scale(1.04);
  }
  .flower--lily .center {
    width: 0.6em;
    height: 0.6em;
    margin: -0.3em 0 0 -0.3em;
  }

  /* --- margarida: 8 pétalas arredondadas em volta do miolo, pretas --- */
  .flower--daisy { --size: 4.6em; }
  .flower--daisy .petal {
    width: 1.45em;
    height: 2.1em;
    margin: -2.1em 0 0 -0.725em;
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    background: linear-gradient(180deg, var(--petal-hi, var(--noir-sheen)) 0%, var(--petal-lo, var(--noir)) 82%);
    box-shadow: inset 0.04em 0.06em 0.12em rgba(255, 255, 255, 0.13);
    transform: rotate(calc(var(--i) * 45deg)) translateY(-0.3em) scale(0.94);
  }
  .flower--daisy:hover .petal,
  .flower--daisy:focus-visible .petal,
  .flower--daisy.is-open .petal {
    transform: rotate(calc(var(--i) * 45deg)) translateY(-0.55em) scale(1.05);
  }
  .flower--daisy .center {
    width: 1em;
    height: 1em;
    margin: -0.5em 0 0 -0.5em;
  }

  /* --- tulipa: 2 camadas recortadas, silhueta de botão fechado --- */
  .flower--tulip { --size: 3em; }
  .flower--tulip .petal:nth-of-type(1) {
    width: 2em;
    height: 3.1em;
    margin: -1.55em 0 0 -1em;
    clip-path: polygon(50% 0%, 92% 26%, 84% 66%, 64% 100%, 36% 100%, 16% 66%, 8% 26%);
    background: linear-gradient(160deg, #2c2c33 0%, #08080a 85%);
  }
  .flower--tulip:hover .petal:nth-of-type(1),
  .flower--tulip:focus-visible .petal:nth-of-type(1),
  .flower--tulip.is-open .petal:nth-of-type(1) {
    transform: translateY(-0.12em) scale(1.05);
  }
  .flower--tulip .petal:nth-of-type(2) {
    width: 1.05em;
    height: 2.15em;
    margin: -1.25em 0 0 -0.525em;
    clip-path: polygon(50% 0%, 88% 28%, 78% 68%, 58% 100%, 42% 100%, 22% 68%, 12% 28%);
    background: linear-gradient(160deg, #55555f 0%, #1f1f24 85%);
    opacity: 0.85;
  }
  .flower--tulip:hover .petal:nth-of-type(2),
  .flower--tulip:focus-visible .petal:nth-of-type(2),
  .flower--tulip.is-open .petal:nth-of-type(2) {
    transform: translateY(-0.16em) scale(1.06);
  }
  .flower--tulip .center { opacity: 0; }

  /* --- girassol: 18 pétalas finas em volta de um disco central grande --- */
  .flower--sunflower { --size: 5.6em; }
  .flower--sunflower .petal {
    width: 0.74em;
    height: 2.1em;
    margin: -2.1em 0 0 -0.37em;
    border-radius: 50% 50% 0 0 / 60% 60% 0 0;
    background: linear-gradient(180deg, #38383f 0%, #0c0c0f 88%);
    box-shadow: inset 0.03em 0.05em 0.08em rgba(255, 255, 255, 0.13);
    transform: rotate(calc(var(--i) * 20deg)) translateY(-0.8em) scale(0.92);
  }
  .flower--sunflower:hover .petal,
  .flower--sunflower:focus-visible .petal,
  .flower--sunflower.is-open .petal {
    transform: rotate(calc(var(--i) * 20deg)) translateY(-1em) scale(1.05);
  }
  .flower--sunflower .center {
    width: 2.3em;
    height: 2.3em;
    margin: -1.15em 0 0 -1.15em;
    background: radial-gradient(circle at 35% 30%, #2e282b, #070606 85%);
    box-shadow: 0 0 0 0.09em color-mix(in srgb, var(--gold) 75%, transparent), inset 0 0 0.3em rgba(0, 0, 0, 0.6);
  }

  .center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1.05em;
    height: 1.05em;
    margin: -0.52em 0 0 -0.52em;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f0d998, var(--gold) 60%, var(--gold-soft) 100%);
    box-shadow: 0 0 0.4em color-mix(in srgb, var(--gold) 50%, transparent);
    z-index: 3;
    transform: scale(var(--s, 1));
    transition: transform 0.4s ease;
  }

  .flower:hover .center,
  .flower:focus-visible .center,
  .flower.is-open .center {
    transform: scale(calc(var(--s, 1) * 1.15));
  }

  .note {
    position: absolute;
    bottom: 92%;
    width: max(11.5em, min(11.5rem, 46vw));
    max-width: 46vw;
    padding: 0.85em 1em 0.9em;
    background:
      linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
    color: var(--ink);
    border-radius: 0.2em;
    box-shadow: 0 0.6em 1.4em var(--shadow), 0 0 0 1px color-mix(in srgb, var(--gold) 40%, transparent);
    transform: translateY(0.5em) rotate(var(--tilt, -2deg)) scale(0.85);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    z-index: 5;
  }

  .note::after {
    content: "";
    position: absolute;
    bottom: -0.55em;
    width: 0.9em;
    height: 0.9em;
    background: inherit;
    box-shadow: inherit;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }

  .note.align-left { left: 0; transform-origin: bottom left; }
  .note.align-left::after { left: 1.1em; }
  .note.align-right { right: 0; transform-origin: bottom right; }
  .note.align-right::after { right: 1.1em; }
  .note.align-center { left: 50%; transform: translate(-50%, 0.5em) rotate(var(--tilt, -2deg)) scale(0.85); transform-origin: bottom center; }
  .note.align-center::after { left: 50%; margin-left: -0.45em; }

  .flower:hover .note,
  .flower:focus-visible .note,
  .flower.is-open .note {
    opacity: 1;
    transform: translateY(0) rotate(var(--tilt, -2deg)) scale(1);
  }

  .flower.is-open .note.align-center,
  .flower:hover .note.align-center,
  .flower:focus-visible .note.align-center {
    transform: translate(-50%, 0) rotate(var(--tilt, -2deg)) scale(1);
  }

  .note p {
    margin: 0;
    font-family: "Big Caslon", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-style: italic;
    font-size: 0.92rem;
    line-height: 1.4;
    text-wrap: balance;
  }

  .note .signoff {
    display: block;
    margin-top: 0.5em;
    font-family: Optima, Candara, "Segoe UI", system-ui, sans-serif;
    font-style: normal;
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  footer {
    position: relative;
    z-index: 1;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--gold-soft);
    text-align: center;
    opacity: 0.8;
  }

  .music {
    all: unset;
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.7em;
    min-height: 2.6rem;
    padding: 0 1.1em;
    border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent);
    border-radius: 999px;
    background: color-mix(in srgb, var(--bg) 75%, transparent);
    color: var(--gold-soft);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.3s ease, border-color 0.3s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .music[hidden] { display: none; }

  .music:hover,
  .music.is-playing {
    color: var(--gold);
    border-color: var(--gold);
  }

  .music:focus-visible {
    box-shadow: 0 0 0 0.2em color-mix(in srgb, var(--gold) 60%, transparent);
  }

  .music-bars {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 1.2em;
  }

  .music-bars span {
    width: 2px;
    height: 25%;
    border-radius: 1px;
    background: currentColor;
  }

  .music.is-playing .music-bars span {
    animation: musicBar 0.8s ease-in-out infinite alternate;
  }
  .music.is-playing .music-bars span:nth-child(2) { animation-delay: -0.5s; }
  .music.is-playing .music-bars span:nth-child(3) { animation-delay: -0.25s; }

  @media (max-width: 560px) {
    .music { min-width: 2.6rem; padding: 0; }
    .music-title { display: none; }
  }

  @keyframes musicBar {
    from { height: 20%; }
    to { height: 100%; }
  }

  @keyframes stemShoot {
    0% { transform: scale(0); opacity: 0; }
    12% { opacity: 1; }
    72% { transform: scale(1.015); }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes cometTravel {
    0% { stroke-dashoffset: 7; opacity: 1; }
    88% { opacity: 1; }
    100% { stroke-dashoffset: -100; opacity: 0; }
  }

  @keyframes leafIn {
    to { opacity: 1; }
  }

  @keyframes ribbonIn {
    to { opacity: 1; transform: translate(-50%, 0) scale(1); }
  }

  @keyframes bloomIn {
    from { opacity: 0; transform: translate(-50%, -30%) scale(0.3); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stems path.stem { animation: none; opacity: 1; transform: scale(1) rotate(0deg); }
    .stems path.stem-glow { animation: none; opacity: 0; }
    .ribbon { animation: none; opacity: 1; transform: translate(-50%, 0) scale(1); }
    .stems .leaf { animation: none; opacity: 1; }
    .flower { animation: none; opacity: 1; transform: translate(-50%, -50%); }
    .petals, .petal, .note, .center { transition: none; }
    .music.is-playing .music-bars span { animation: none; height: 70%; }
  }
</style>
</head>
<body>

<main class="stage-wrap">
  <canvas id="fireflies" aria-hidden="true"></canvas>

  <header class="dedication">
    <p class="eyebrow">um buquê que não murcha</p>
    <h1>Para Katherine, meu amor <span class="heart" aria-hidden="true">♥</span></h1>
    <div class="flourish" aria-hidden="true"></div>
    <p class="hint">toque ou passe o mouse sobre cada flor para abrir um bilhete</p>
  </header>

  <div class="bouquet" id="bouquet">
    <svg class="stems" viewBox="0 0 840 640" preserveAspectRatio="none">
      <path class="stem" style="--sdelay:0.25s" d="M420,538 Q341,341 222,180 M420,538 L453,620" />
      <path class="stem-glow" style="--sdelay:0.25s" pathLength="100" d="M420,538 Q341,341 222,180" />

      <path class="stem" style="--sdelay:0.80s" d="M420,538 Q390,380 345,250 M420,538 L435,617" />
      <path class="stem-glow" style="--sdelay:0.80s" pathLength="100" d="M420,538 Q390,380 345,250" />

      <path class="stem" style="--sdelay:1.35s" d="M420,538 Q434,304 455,112 M420,538 L415,630" />
      <path class="stem-glow" style="--sdelay:1.35s" pathLength="100" d="M420,538 Q434,304 455,112" />

      <path class="stem" style="--sdelay:1.90s" d="M420,538 Q378,295 316,96 M420,538 L433,613" />
      <path class="stem-glow" style="--sdelay:1.90s" pathLength="100" d="M420,538 Q378,295 316,96" />

      <path class="stem" style="--sdelay:2.45s" d="M420,538 Q451,385 498,260 M420,538 L403,620" />
      <path class="stem-glow" style="--sdelay:2.45s" pathLength="100" d="M420,538 Q451,385 498,260" />

<script>
  // ---------------------------------------------------------------
  // EDITE AQUI: troque as 8 frases pelas suas próprias mensagens.
  // A ordem segue a ordem das flores no buquê (flor 1 a 8).
  // ---------------------------------------------------------------
  const PHRASES = [
    "Katherine, você é o motivo dos meus melhores dias começarem com um sorriso.",
    "Cada pétala deste buquê é um pedacinho do tanto que eu penso em você.",
    "Contigo, até os dias comuns viram os meus favoritos.",
    "Eu escolheria você em qualquer versão da minha vida.",
    "Seu jeito de rir é a coisa mais bonita que eu conheço.",
    "Obrigado por ser o meu lugar mais seguro e mais feliz.",
    "Te amo nas coisas pequenas: no café da manhã, nas ligações bobas, em tudo.",
    "Esse buquê nunca vai murchar, porque foi feito do meu amor por você."
  ];

  document.querySelectorAll(".note").forEach((note) => {
    const slot = Number(note.dataset.noteSlot);
    const p = note.querySelector("p");
    if (p && PHRASES[slot]) p.textContent = PHRASES[slot];
  });

  const flowers = document.querySelectorAll(".flower");
  flowers.forEach((flower) => {
    flower.setAttribute("aria-expanded", "false");
    flower.addEventListener("click", () => {
      // um bilhete por vez: abrir uma flor fecha as outras
      const open = !flower.classList.contains("is-open");
      flowers.forEach((other) => {
        const isOpen = open && other === flower;
        other.classList.toggle("is-open", isOpen);
        other.setAttribute("aria-expanded", String(isOpen));
      });
    });
  });

  // ---------------------------------------------------------------
  // EDITE AQUI: música de fundo. Coloque o arquivo de áudio na mesma
  // pasta desta página e ajuste o nome dele e o título do botão.
  // ---------------------------------------------------------------
  const MUSICA = { arquivo: "musica.mp3", titulo: "Avenged Sevenfold", volume: 0.6 };

  const musicBtn = document.getElementById("music");
  const song = new Audio(MUSICA.arquivo);
  song.loop = true;
  song.volume = MUSICA.volume;
  musicBtn.querySelector(".music-title").textContent = MUSICA.titulo;

  function syncMusic() {
    const playing = !song.paused;
    const label = playing ? "Pausar música" : "Tocar música";
    musicBtn.classList.toggle("is-playing", playing);
    musicBtn.setAttribute("aria-label", label);
    musicBtn.title = label;
  }
  song.addEventListener("play", syncMusic);
  song.addEventListener("pause", syncMusic);
  syncMusic();

  // O botão só aparece quando o arquivo de áudio existe e pode tocar.
  song.addEventListener("canplay", () => { musicBtn.hidden = false; }, { once: true });

  musicBtn.addEventListener("click", () => {
    if (song.paused) song.play().catch(() => {});
    else song.pause();
  });

  // Navegadores só liberam som depois de um gesto: tenta tocar de cara e,
  // se for bloqueado, a música começa no primeiro clique ou tecla na página.
  const gestures = ["click", "keydown"];
  const stopWaiting = () => gestures.forEach((type) => window.removeEventListener(type, startOnGesture));
  function startOnGesture(event) {
    if (song.error || musicBtn.contains(event.target)) return stopWaiting();
    song.play().then(stopWaiting, () => {});
  }
  song.play().catch(() => gestures.forEach((type) => window.addEventListener(type, startOnGesture)));

  // Ambient fireflies — respects reduced-motion preference.
  const canvas = document.getElementById("fireflies");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (canvas && !reduceMotion) {
    const ctx = canvas.getContext("2d");
    let w, h, particles;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    function makeParticles() {
      const count = Math.min(22, Math.floor((w * h) / 60000));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.6 + 0.6,
        speed: Math.random() * 0.25 + 0.08,
        drift: Math.random() * 0.6 - 0.3,
        phase: Math.random() * Math.PI * 2,
        glow: Math.random() * 0.5 + 0.5
      }));
    }

    function tick(t) {
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) {
        p.y -= p.speed;
        p.x += Math.sin(t / 2000 + p.phase) * p.drift * 0.02;
        if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
        const flicker = 0.5 + 0.5 * Math.sin(t / 900 + p.phase);
        ctx.beginPath();
        ctx.fillStyle = `rgba(201,162,75,${(0.15 + flicker * 0.35 * p.glow).toFixed(3)})`;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }

    resize();
    makeParticles();
    window.addEventListener("resize", () => { resize(); makeParticles(); });
    requestAnimationFrame(tick);
  }
</script>
